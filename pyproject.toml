description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jkolberg", email = "jkolberg@psrc.org" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "jinja2>=3.1.6",
    "nbformat>=5.11.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "psrcelmerpy @git+https://github.com/psrc/psrcelmerpy.git",
